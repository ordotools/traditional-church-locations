<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Traditional Mass Centers</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div id="map"></div>
  <div id="map-title">Traditional Mass Centers</div>
  <details id="legend" hidden>
    <summary>Legend</summary>
    <div id="legend-body"></div>
    <!-- Filled by renderStatusLegend() in map.js, from /api/status-settings
         (labels + which statuses to show here are editable at /admin/statuses). -->
    <div id="legend-status" hidden></div>
  </details>
  <div id="map-banner" class="notice" hidden></div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="/js/map.js"></script>
</body>
</html>
